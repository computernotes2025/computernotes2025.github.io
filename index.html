<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 
<title>Computers ISC Class 12 2026 — Nav Hub</title>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<style>
    :root {
        --bg: #070910;

        --glass: rgba(16, 20, 35, 0.68);
        --glass-hover: rgba(23, 28, 48, 0.82);

        --border: rgba(255, 255, 255, 0.085);
        --border-hover: rgba(129, 140, 248, 0.42);

        --text: #f8fafc;
        --muted: #94a3b8;

        --accent: #6366f1;
        --accent-2: #a855f7;

        --shadow:
            0 35px 90px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;

        font-family:
            Inter,
            "Segoe UI",
            Roboto,
            -apple-system,
            BlinkMacSystemFont,
            sans-serif;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        color: var(--text);

        background:
            radial-gradient(
                circle at 50% 0%,
                rgba(99, 102, 241, 0.10),
                transparent 35%
            ),
            var(--bg);

        overflow-x: hidden;
        position: relative;
    }

    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
        position: fixed;
        inset: 0;

        overflow: hidden;
        pointer-events: none;

        z-index: 0;
    }

    .grid {
        position: absolute;
        inset: 0;

        background-image:
            linear-gradient(
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255,255,255,0.025) 1px,
                transparent 1px
            );

        background-size: 45px 45px;

        mask-image:
            linear-gradient(
                to bottom,
                black 0%,
                transparent 85%
            );
    }

    .glow {
        position: absolute;

        border-radius: 50%;

        filter: blur(100px);
    }

    .glow-1 {
        width: 500px;
        height: 500px;

        left: -140px;
        top: -120px;

        background: rgba(99, 102, 241, 0.18);
    }

    .glow-2 {
        width: 480px;
        height: 480px;

        right: -150px;
        bottom: -140px;

        background: rgba(168, 85, 247, 0.15);
    }

    .glow-3 {
        width: 350px;
        height: 350px;

        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);

        background: rgba(56, 189, 248, 0.06);
    }

    /* =========================================================
       MAIN CARD
    ========================================================= */

    .menu-container {
        position: relative;
        z-index: 2;

        width: min(92vw, 480px);
        max-height: 92vh;

        padding: 34px;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.045),
                rgba(255,255,255,0.012)
            ),
            var(--glass);

        border: 1px solid var(--border);
        border-radius: 28px;

        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);

        box-shadow: var(--shadow);

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    .menu-container::before {
        content: "";

        position: absolute;
        inset: 0;

        background:
            linear-gradient(
                120deg,
                rgba(255,255,255,0.05),
                transparent 30%
            );

        pointer-events: none;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .header {
        position: relative;
        z-index: 1;

        text-align: center;
    }

    .header-badge {
        width: 48px;
        height: 48px;

        margin: 0 auto 16px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 15px;

        background:
            linear-gradient(
                135deg,
                rgba(99, 102, 241, 0.22),
                rgba(168, 85, 247, 0.18)
            );

        border: 1px solid rgba(129, 140, 248, 0.25);

        box-shadow:
            0 0 35px rgba(99, 102, 241, 0.18),
            inset 0 1px rgba(255,255,255,0.08);

        color: #c7d2fe;

        font-size: 20px;
    }

    .header h1 {
        font-size: clamp(1.65rem, 5vw, 2.15rem);

        font-weight: 750;

        line-height: 1.12;

        letter-spacing: -0.8px;

        background:
            linear-gradient(
                135deg,
                #ffffff 15%,
                #dbeafe 50%,
                #a5b4fc 100%
            );

        -webkit-background-clip: text;
        background-clip: text;

        -webkit-text-fill-color: transparent;
    }

    .header p {
        margin-top: 10px;
        margin-bottom: 28px;

        color: var(--muted);

        font-size: 0.93rem;
    }

    /* =========================================================
       MENU
    ========================================================= */

    .menu-list {
        position: relative;
        z-index: 1;

        display: flex;
        flex-direction: column;

        gap: 12px;

        max-height: 55vh;

        overflow-y: auto;

        padding: 3px 5px 6px 1px;

        scrollbar-width: thin;

        scrollbar-color:
            rgba(255,255,255,0.14)
            transparent;
    }

    .menu-list::-webkit-scrollbar {
        width: 5px;
    }

    .menu-list::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.12);
        border-radius: 99px;
    }

    /* =========================================================
       MENU ITEM
    ========================================================= */

    .menu-item {
        position: relative;

        display: flex;
        align-items: center;

        min-height: 70px;

        padding: 14px 16px;

        text-decoration: none;
        color: var(--text);

        border-radius: 18px;

        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,0.042),
                rgba(255,255,255,0.016)
            );

        border: 1px solid var(--border);

        overflow: hidden;

        transform-origin: center;

        transition:
            background 0.25s ease,
            border-color 0.25s ease,
            box-shadow 0.25s ease;
    }

    .menu-item:hover {
        background: var(--glass-hover);

        border-color: var(--border-hover);

        box-shadow:
            0 18px 45px rgba(0,0,0,0.25),
            0 0 30px rgba(99,102,241,0.08);
    }

    .menu-item::before {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 70%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.07),
                transparent
            );

        transform: skewX(-20deg);

        transition: left 0.65s ease;

        pointer-events: none;
    }

    .menu-item:hover::before {
        left: 140%;
    }

    .menu-item::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        left: var(--mouse-x, 50%);
        top: var(--mouse-y, 50%);

        transform: translate(-50%, -50%);

        background:
            radial-gradient(
                circle,
                rgba(99,102,241,0.12),
                transparent 70%
            );

        opacity: 0;

        transition: opacity 0.25s ease;

        pointer-events: none;
    }

    .menu-item:hover::after {
        opacity: 1;
    }

    .badge {
        position: relative;
        z-index: 1;

        width: 42px;
        height: 42px;

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-right: 15px;

        border-radius: 12px;

        color: #a5b4fc;

        background:
            rgba(99,102,241,0.11);

        border: 1px solid rgba(99,102,241,0.2);

        font-weight: 700;

        box-shadow:
            inset 0 1px rgba(255,255,255,0.04);

        transition:
            background 0.3s ease,
            color 0.3s ease,
            box-shadow 0.3s ease;
    }

    .menu-item:hover .badge {
        color: white;

        background:
            linear-gradient(
                135deg,
                var(--accent),
                var(--accent-2)
            );

        border-color: transparent;

        box-shadow:
            0 0 25px rgba(99,102,241,0.38);
    }

    .menu-content {
        position: relative;
        z-index: 1;

        min-width: 0;

        flex: 1;
    }

    .title {
        display: block;

        font-size: 1rem;

        font-weight: 650;

        letter-spacing: 0.1px;

        overflow: hidden;

        white-space: nowrap;

        text-overflow: ellipsis;
    }

    .subtitle {
        display: block;

        margin-top: 3px;

        color: #64748b;

        font-size: 0.76rem;
    }

    .arrow {
        position: relative;
        z-index: 1;

        width: 21px;
        height: 21px;

        flex-shrink: 0;

        margin-left: 12px;

        fill: none;

        stroke: #64748b;

        stroke-width: 2;

        stroke-linecap: round;
        stroke-linejoin: round;

        transition:
            transform 0.3s ease,
            stroke 0.3s ease;
    }

    .menu-item:hover .arrow {
        transform: translateX(5px);

        stroke: #fff;
    }

    /* =========================================================
       PAGE TRANSITION
    ========================================================= */

    .page-transition {
        position: fixed;

        inset: 0;

        z-index: 1000;

        display: flex;

        align-items: center;
        justify-content: center;

        background:
            rgba(5, 6, 11, 0.97);

        pointer-events: none;

        visibility: hidden;

        opacity: 0;
    }

    .transition-content {
        position: relative;

        z-index: 2;

        text-align: center;

        opacity: 0;
    }

    .transition-number {
        display: block;

        margin-bottom: 10px;

        color: #818cf8;

        font-size: 0.75rem;

        font-weight: 700;

        letter-spacing: 0.16em;

        text-transform: uppercase;
    }

    .transition-title {
        font-size:
            clamp(1.8rem, 6vw, 3rem);

        font-weight: 750;

        letter-spacing: -1px;

        color: #f8fafc;
    }

    .transition-line {
        width: 0;

        height: 1px;

        margin: 16px auto 0;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(129,140,248,0.8),
                transparent
            );
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 560px) {

        body {
            align-items: flex-start;

            padding-top: 4vh;
            padding-bottom: 4vh;
        }

        .menu-container {
            width: 94vw;

            padding: 27px 20px;

            border-radius: 23px;
        }

        .menu-list {
            max-height: 70vh;
        }

        .menu-item {
            min-height: 64px;

            padding: 12px 13px;
        }

        .badge {
            width: 38px;
            height: 38px;

            margin-right: 12px;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            scroll-behavior: auto !important;
        }
    }
</style>
 

</head>

<body>

 
<!-- =========================================================
     BACKGROUND
========================================================= -->

<div class="background">

    <div class="grid"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

</div>


<!-- =========================================================
     MAIN CARD
========================================================= -->

<main class="menu-container">

    <header class="header">

        <div class="header-badge">
            ✦
        </div>

        <h1>
            Nav Hub For All Essentials ISC Computer Science
        </h1>

        <p>
            ISC Class 12 • 2026
        </p>

    </header>


    <nav
        class="menu-list"
        id="menuList"
        aria-label="Computer resources"
    ></nav>

</main>


<!-- =========================================================
     PAGE TRANSITION
========================================================= -->

<div
    class="page-transition"
    id="pageTransition"
    aria-hidden="true"
>

    <div
        class="transition-content"
        id="transitionContent"
    >

        <span
            class="transition-number"
            id="transitionNumber"
        >
            OPENING
        </span>

        <div
            class="transition-title"
            id="transitionTitle"
        >
            Loading...
        </div>

        <div
            class="transition-line"
            id="transitionLine"
        ></div>

    </div>

</div>


<script>

    /* =========================================================
       MENU ENTRIES
       
       Add more pages here.
    ========================================================= */

    const defaultItems = [

        {
            title: "Recursion Programs",
            url: "recursionprogs"
        },

        {
            title: "Memory Address",
            url: "memaddress"
        },

        {
            title: "Recursion Basics",
            url: "recursion"
        },

        {
            title: "2D Array Operations Questions",
            url: "2darrayop"
        },
        {
            title: "Recursion Notebook(Summary And Example Codes)",
            url: "recursionbook"
        }
        /*
         * Example:
         *
         * {
         *     title: "Loops",
         *     url: "loops"
         * }
         */
    ];


    /* =========================================================
       ELEMENTS
    ========================================================= */

    const container =
        document.getElementById("menuList");

    const pageTransition =
        document.getElementById("pageTransition");

    const transitionContent =
        document.getElementById("transitionContent");

    const transitionTitle =
        document.getElementById("transitionTitle");

    const transitionNumber =
        document.getElementById("transitionNumber");

    const transitionLine =
        document.getElementById("transitionLine");


    /* =========================================================
       INITIAL GSAP STATE
    ========================================================= */

    gsap.set(
        ".menu-container",
        {
            opacity: 0,
            y: 30,
            scale: 0.98
        }
    );

    gsap.set(
        ".header > *",
        {
            opacity: 0,
            y: 16
        }
    );


    /* =========================================================
       RESET TRANSITION
       
       This is the important Back-button fix.
    ========================================================= */

    function resetPageTransition() {

        gsap.killTweensOf(
            [
                pageTransition,
                transitionContent,
                transitionLine
            ]
        );

        gsap.set(
            pageTransition,
            {
                opacity: 0,
                visibility: "hidden",
                pointerEvents: "none"
            }
        );

        gsap.set(
            transitionContent,
            {
                opacity: 0,
                y: 20,
                scale: 0.98
            }
        );

        gsap.set(
            transitionLine,
            {
                width: 0
            }
        );

        /*
         * Re-enable the page.
         */
        document.body.style.pointerEvents =
            "";

        document.body.style.overflow =
            "";
    }


    /*
     * pageshow fires when:
     *
     * - the page loads normally
     * - the browser restores it from bfcache
     * - the user presses Back
     * - the user presses Forward
     *
     * This prevents the transition overlay from
     * remaining stuck after Back.
     */
    window.addEventListener(
        "pageshow",
        () => {

            resetPageTransition();
        }
    );


    /* =========================================================
       RENDER MENU
    ========================================================= */

    function renderMenu() {

        container.innerHTML = "";


        defaultItems.forEach(
            (item, index) => {

                const menuItem =
                    document.createElement("a");


                menuItem.href =
                    item.url;


                menuItem.className =
                    "menu-item";


                menuItem.dataset.index =
                    index;


                menuItem.innerHTML = `

                    <div class="badge">
                        ${String(index + 1).padStart(2, "0")}
                    </div>

                    <div class="menu-content">

                        <span class="title">
                            ${escapeHTML(item.title)}
                        </span>

                        <span class="subtitle">
                            Open resource
                        </span>

                    </div>

                    <svg
                        class="arrow"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 12h14M12 5l7 7-7 7"
                        ></path>

                    </svg>

                `;


                container.appendChild(
                    menuItem
                );
            }
        );


        /*
         * Animate menu entries.
         */
        gsap.fromTo(
            ".menu-item",
            {
                opacity: 0,
                y: 16,
                scale: 0.985
            },
            {
                opacity: 1,
                y: 0,
                scale: 1,

                duration: 0.5,

                stagger: 0.07,

                ease: "power3.out"
            }
        );


        setupMenuInteractions();
    }


    /* =========================================================
       MENU INTERACTIONS
    ========================================================= */

    function setupMenuInteractions() {

        const items =
            document.querySelectorAll(
                ".menu-item"
            );


        items.forEach(
            (item) => {

                item.addEventListener(
                    "mousemove",
                    (event) => {

                        const rect =
                            item.getBoundingClientRect();


                        const x =
                            event.clientX -
                            rect.left;


                        const y =
                            event.clientY -
                            rect.top;


                        item.style.setProperty(
                            "--mouse-x",
                            `${x}px`
                        );


                        item.style.setProperty(
                            "--mouse-y",
                            `${y}px`
                        );


                        /*
                         * Very subtle 3D movement.
                         */
                        const rotateX =
                            ((y / rect.height) - 0.5)
                            * -2.5;


                        const rotateY =
                            ((x / rect.width) - 0.5)
                            * 2.5;


                        gsap.to(
                            item,
                            {
                                rotateX,
                                rotateY,

                                duration: 0.25,

                                ease: "power2.out",

                                overwrite: true,

                                transformPerspective: 800
                            }
                        );
                    }
                );


                item.addEventListener(
                    "mouseleave",
                    () => {

                        gsap.to(
                            item,
                            {
                                rotateX: 0,
                                rotateY: 0,

                                duration: 0.3,

                                ease: "power3.out"
                            }
                        );
                    }
                );


                /*
                 * Click → transition → page.
                 */
                item.addEventListener(
                    "click",
                    (event) => {

                        /*
                         * Keep Ctrl/Cmd/Shift/Alt clicks
                         * behaving like normal links.
                         */
                        if (
                            event.ctrlKey ||
                            event.metaKey ||
                            event.shiftKey ||
                            event.altKey
                        ) {
                            return;
                        }


                        event.preventDefault();


                        const index =
                            Number(
                                item.dataset.index
                            );


                        startPageTransition(
                            item,
                            defaultItems[index]
                        );
                    }
                );
            }
        );
    }


    /* =========================================================
       SUBTLE PAGE TRANSITION
    ========================================================= */

    function startPageTransition(
        clickedItem,
        menuItem
    ) {

        if (!menuItem) {
            return;
        }


        /*
         * Disable interaction during transition.
         */
        document.body.style.pointerEvents =
            "none";


        document.body.style.overflow =
            "hidden";


        transitionTitle.textContent =
            menuItem.title;


        transitionNumber.textContent =
            `RESOURCE ${String(
                defaultItems.indexOf(menuItem) + 1
            ).padStart(2, "0")}`;


        pageTransition.style.visibility =
            "visible";


        pageTransition.style.pointerEvents =
            "auto";


        /*
         * Reset transition elements before playing.
         */
        gsap.set(
            pageTransition,
            {
                opacity: 0
            }
        );


        gsap.set(
            transitionContent,
            {
                opacity: 0,
                y: 18,
                scale: 0.985
            }
        );


        gsap.set(
            transitionLine,
            {
                width: 0
            }
        );


        const tl =
            gsap.timeline();


        /*
         * Subtle press on selected item.
         */
        tl.to(
            clickedItem,
            {
                scale: 0.975,

                duration: 0.12,

                ease: "power2.out"
            }
        );


        /*
         * Simple dark fade.
         */
        tl.to(
            pageTransition,
            {
                opacity: 1,

                duration: 0.28,

                ease: "power2.inOut"
            }
        );


        /*
         * Title appears.
         */
        tl.to(
            transitionContent,
            {
                opacity: 1,

                y: 0,

                scale: 1,

                duration: 0.4,

                ease: "power3.out"
            },
            "-=0.08"
        );


        /*
         * Small loading line.
         */
        tl.to(
            transitionLine,
            {
                width: 130,

                duration: 0.3,

                ease: "power2.out"
            },
            "-=0.18"
        );


        /*
         * Brief pause.
         */
        tl.to(
            {},
            {
                duration: 0.22
            }
        );


        /*
         * Navigate.
         *
         * Relative URLs work directly on:
         *
         * https://username.github.io/
         */
        tl.call(
            () => {

                window.location.href =
                    menuItem.url;

            }
        );
    }


    /* =========================================================
       SAFE HTML
    ========================================================= */

    function escapeHTML(value) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value;


        return div.innerHTML;
    }


    /* =========================================================
       INTRO ANIMATION
    ========================================================= */

    function introAnimation() {

        const tl =
            gsap.timeline(
                {
                    defaults: {
                        ease: "power3.out"
                    }
                }
            );


        /*
         * Card.
         */
        tl.to(
            ".menu-container",
            {
                opacity: 1,

                y: 0,

                scale: 1,

                duration: 0.7,

                ease: "expo.out"
            }
        );


        /*
         * Header.
         */
        tl.to(
            ".header > *",
            {
                opacity: 1,

                y: 0,

                duration: 0.45,

                stagger: 0.08
            },
            "-=0.4"
        );


        /*
         * Gentle ambient background.
         */
        gsap.to(
            ".glow-1",
            {
                x: 60,
                y: 45,
                scale: 1.08,

                duration: 9,

                repeat: -1,
                yoyo: true,

                ease: "sine.inOut"
            }
        );


        gsap.to(
            ".glow-2",
            {
                x: -55,
                y: -40,
                scale: 1.06,

                duration: 11,

                repeat: -1,
                yoyo: true,

                ease: "sine.inOut"
            }
        );


        gsap.to(
            ".glow-3",
            {
                scale: 1.12,

                duration: 8,

                repeat: -1,
                yoyo: true,

                ease: "sine.inOut"
            }
        );
    }


    /* =========================================================
       START
    ========================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            renderMenu();

            introAnimation();
        }
    );

</script>
 

</body>
</html>
