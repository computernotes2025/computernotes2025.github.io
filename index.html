<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computers ISC Class 12 2026 — Nav Hub</title>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <style>
        :root {
            --bg: #070910;
            --glass: rgba(16, 20, 35, 0.68);
            --glass-hover: rgba(23, 28, 48, 0.82);
            --border: rgba(255, 255, 255, 0.085);
            --border-hover: rgba(129, 140, 248, 0.42);
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-2: #a855f7;
            --shadow: 0 35px 90px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.10), transparent 35%), var(--bg);
            overflow-x: hidden;
            position: relative;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, black 0%, transparent 85%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 85%);
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
        }

        .glow-1 { width: 500px; height: 500px; left: -140px; top: -120px; background: rgba(99, 102, 241, 0.18); }
        .glow-2 { width: 480px; height: 480px; right: -150px; bottom: -140px; background: rgba(168, 85, 247, 0.15); }
        .glow-3 { width: 350px; height: 350px; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(56, 189, 248, 0.06); }

        .cards-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            z-index: 2;
        }

        .menu-container {
            width: min(92vw, 480px);
            max-height: 90vh;
            padding: 32px;
            background: linear-gradient(145deg, rgba(255,255,255,0.045), rgba(255,255,255,0.012)), var(--glass);
            border: 1px solid var(--border);
            border-radius: 28px;
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .header-badge {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(168, 85, 247, 0.18));
            border: 1px solid rgba(129, 140, 248, 0.25);
            box-shadow: 0 0 35px rgba(99, 102, 241, 0.18), inset 0 1px rgba(255,255,255,0.08);
            color: #c7d2fe;
            font-size: 20px;
        }

        .header h1 {
            font-size: clamp(1.55rem, 4.5vw, 2rem);
            font-weight: 750;
            line-height: 1.12;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #ffffff 15%, #dbeafe 50%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 8px;
            margin-bottom: 24px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .menu-list {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 56vh;
            overflow-y: auto;
            padding: 3px 5px 6px 1px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.14) transparent;
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: flex-start;
            min-height: 72px;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,255,255,0.042), rgba(255,255,255,0.016));
            border: 1px solid var(--border);
            overflow: hidden;
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
        }

        .menu-item:hover {
            background: var(--glass-hover);
            border-color: var(--border-hover);
            box-shadow: 0 18px 45px rgba(0,0,0,0.25), 0 0 30px rgba(99,102,241,0.08);
        }

        .badge {
            position: relative;
            z-index: 1;
            width: 42px; height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            border-radius: 12px;
            color: #a5b4fc;
            background: rgba(99,102,241,0.11);
            border: 1px solid rgba(99,102,241,0.2);
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 2px;
        }

        .menu-content {
            position: relative;
            z-index: 1;
            min-width: 0;
            flex: 1;
        }

        .title {
            display: block;
            font-size: 0.95rem;
            font-weight: 650;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .subtitle {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .arrow {
            width: 20px; height: 20px;
            flex-shrink: 0;
            margin-left: 12px;
            margin-top: 10px;
            fill: none;
            stroke: #64748b;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-transition {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 6, 11, 0.97);
            pointer-events: none;
            visibility: hidden;
            opacity: 0;
        }
        .transition-content { position: relative; z-index: 2; text-align: center; opacity: 0; }
        .transition-number { display: block; margin-bottom: 10px; color: #818cf8; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
        .transition-title { font-size: clamp(1.8rem, 6vw, 3rem); font-weight: 750; color: #f8fafc; }
        .transition-line { width: 0; height: 1px; margin: 16px auto 0; background: linear-gradient(90deg, transparent, rgba(129,140,248,0.8), transparent); }

        @media (max-width: 768px) {
            body { align-items: flex-start; padding: 3vh 0; }
            .menu-container { width: 94vw !important; }
        }
    </style>
</head>
<body>

<div class="background">
    <div class="grid"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
</div>

<div class="cards-wrapper">
    <!-- MAIN NAV CARD -->
    <main class="menu-container" id="navCard">
        <header class="header">
            <div class="header-badge">✦</div>
            <h1>Nav Hub For All Essentials ISC Computer Science</h1>
            <p>ISC Class 12 • 2026</p>
        </header>
        <nav class="menu-list" id="menuList" aria-label="Computer resources"></nav>
    </main>
</div>

<div class="page-transition" id="pageTransition" aria-hidden="true">
    <div class="transition-content" id="transitionContent">
        <span class="transition-number" id="transitionNumber">OPENING</span>
        <div class="transition-title" id="transitionTitle">Loading...</div>
        <div class="transition-line" id="transitionLine"></div>
    </div>
</div>

<script>
    const defaultItems = [
        { title: "Recursion Programs", url: "recursionprogs" },
        { title: "Row & Column Major Memory Address Calculations", url: "memaddress" },
        { title: "Recursion Basics", url: "recursion" },
        { title: "2D Array Operations Questions", url: "2darrayop" },
        { title: "Recursion Notebook(Summary And Example Codes)", url: "recursionbook" }
    ];

    const container = document.getElementById("menuList");
    const pageTransition = document.getElementById("pageTransition");
    const transitionContent = document.getElementById("transitionContent");
    const transitionTitle = document.getElementById("transitionTitle");
    const transitionNumber = document.getElementById("transitionNumber");
    const transitionLine = document.getElementById("transitionLine");

    gsap.set("#navCard", { opacity: 0, y: 30, scale: 0.98 });
    gsap.set("#navCard .header > *", { opacity: 0, y: 16 });

    function resetPageTransition() {
        gsap.killTweensOf([pageTransition, transitionContent, transitionLine]);
        gsap.set(pageTransition, { opacity: 0, visibility: "hidden", pointerEvents: "none" });
        gsap.set(transitionContent, { opacity: 0, y: 20, scale: 0.98 });
        gsap.set(transitionLine, { width: 0 });
        document.body.style.pointerEvents = "";
        document.body.style.overflow = "";
    }

    window.addEventListener("pageshow", () => { resetPageTransition(); });

    function renderMenu() {
        container.innerHTML = "";
        defaultItems.forEach((item, index) => {
            const menuItem = document.createElement("a");
            menuItem.href = item.url;
            menuItem.className = "menu-item";
            menuItem.dataset.index = index;
            menuItem.innerHTML = `
                <div class="badge">${String(index + 1).padStart(2, "0")}</div>
                <div class="menu-content">
                    <span class="title">${escapeHTML(item.title)}</span>
                    <span class="subtitle">Open resource</span>
                </div>
                <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7"></path>
                </svg>
            `;
            container.appendChild(menuItem);
        });
        setupMenuInteractions();
    }

    function setupMenuInteractions() {
        const items = document.querySelectorAll("#navCard .menu-item");
        items.forEach((item) => {
            item.addEventListener("click", (event) => {
                if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
                event.preventDefault();
                const index = Number(item.dataset.index);
                startPageTransition(item, defaultItems[index]);
            });
        });
    }

    function startPageTransition(clickedItem, menuItem) {
        if (!menuItem) return;
        document.body.style.pointerEvents = "none";
        document.body.style.overflow = "hidden";
        
        transitionTitle.textContent = menuItem.title;
        transitionNumber.textContent = `RESOURCE ${String(defaultItems.indexOf(menuItem) + 1).padStart(2, "0")}`;
        pageTransition.style.visibility = "visible";
        pageTransition.style.pointerEvents = "auto";
        
        gsap.set(pageTransition, { opacity: 0 });
        gsap.set(transitionContent, { opacity: 0, y: 18, scale: 0.985 });
        gsap.set(transitionLine, { width: 0 });

        const tl = gsap.timeline();
        tl.to(clickedItem, { scale: 0.975, duration: 0.12, ease: "power2.out" });
        tl.to(pageTransition, { opacity: 1, duration: 0.28, ease: "power2.inOut" });
        tl.to(transitionContent, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, "-=0.08");
        tl.to(transitionLine, { width: 130, duration: 0.3, ease: "power2.out" }, "-=0.18");
        tl.to({}, { duration: 0.22 });
        tl.call(() => { window.location.href = menuItem.url; });
    }

    function escapeHTML(value) {
        const div = document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }

    function introAnimation() {
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

        tl.to("#navCard", { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" });
        tl.to("#navCard .header > *", { opacity: 1, y: 0, duration: 0.45, stagger: 0.08 }, "-=0.4");
        
        gsap.fromTo("#navCard .menu-item", 
            { opacity: 0, y: 16, scale: 0.985 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.07, ease: "power3.out" },
            "-=0.2"
        );

        gsap.to(".glow-1", { x: 60, y: 45, scale: 1.08, duration: 9, repeat: -1, yoyo: true, ease: "sine.inOut" });
        gsap.to(".glow-2", { x: -55, y: -40, scale: 1.06, duration: 11, repeat: -1, yoyo: true, ease: "sine.inOut" });
        gsap.to(".glow-3", { scale: 1.12, duration: 8, repeat: -1, yoyo: true, ease: "sine.inOut" });
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderMenu();
        introAnimation();
    });
</script>
</body>
</html>
