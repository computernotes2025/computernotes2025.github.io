<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISC Computer Science Complete Dry Run Bank (2003–2026)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --code-bg: #090d16;
            --border: #334155;
            --btn-bg: #1e293b;
            --table-header-bg: #0b1329;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 2rem 1rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1150px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.1rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
        }

        .tabs-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.83rem;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--accent);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .code-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.88rem;
            color: #e2e8f0;
            overflow-x: auto;
            white-space: pre;
        }

        .solution-card {
            background: #141e33;
            border-left: 4px solid var(--accent);
            border-radius: 0 6px 6px 0;
            padding: 1rem;
        }

        .solution-card h3 {
            color: var(--accent);
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
        }

        .toggle-btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            transition: background 0.2s;
        }

        .toggle-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .solution-body {
            display: none;
            margin-top: 0.5rem;
        }

        .dry-run-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.8rem;
            margin-bottom: 0.8rem;
            font-size: 0.82rem;
        }

        .dry-run-table th, .dry-run-table td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }

        .dry-run-table th {
            background: var(--table-header-bg);
            color: var(--accent);
        }

        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }

        .highlight-box {
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 0.88rem;
        }
    </style>
</head>

        const tabsNav = document.getElementById("tabsNav");
        const tabsContainer = document.getElementById("tabsContainer");

        questionsData.forEach((q, idx) => {
            const activeClass = idx === 0 ? "active" : "";
            
            // Tab Buttons
            const btn = document.createElement("button");
            btn.className = `tab-btn ${activeClass}`;
            btn.textContent = q.year;
            btn.onclick = (e) => switchTab(`tab-${q.year}`, e.target);
            tabsNav.appendChild(btn);

            // Tab Content
            const content = document.createElement("div");
            content.id = `tab-${q.year}`;
            content.className = `tab-content ${activeClass}`;
            content.innerHTML = `
                <span class="badge">ISC ${q.year} Board Exam</span>
                <div class="grid">
                    <div>
                        <div class="code-box">${escapeHtml(q.code)}</div>
                    </div>
                    <div>
                        <div class="solution-card">
                            <h3>Detailed Dry Run & Trace Table</h3>
                            <button class="toggle-btn" onclick="toggleSolution(this)">Show Dry Run</button>
                            <div class="solution-body">${q.solution}</div>
                        </div>
                    </div>
                </div>
            `;
            tabsContainer.appendChild(content);
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function toggleSolution(btn) {
            const body = btn.nextElementSibling;
            if (body.style.display === "block") {
                body.style.display = "none";
                btn.textContent = "Show Dry Run";
            } else {
                body.style.display = "block";
                btn.textContent = "Hide Dry Run";
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
